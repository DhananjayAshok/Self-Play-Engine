# CLAUDE GENERATED 100%, DJ DOES NOT APPROVE, MUST BE REVISED
# Before/after evaluation for the copycat RPS RL run: 200 held-out 4-round games at temperature 0.
# Training draws seeds 0, 1, 2, ... (the taskset's stream order), so seeds 100000-100199 are never
# trained on. Sampling matches training (max_tokens = orchestrator.train.sampling.max_completion_tokens).
#   bash scripts/eval.sh --config eval_configs/copycat4_heldout.toml --name copycat4-base
#   bash scripts/eval.sh --config eval_configs/copycat4_heldout.toml --name copycat4-lora --model <adapter name>
model = "google/gemma-4-31b-it"
push = false
max_concurrent = 32

[select.include]
idx = ["100000:100200"]

[client]
type = "eval"
base_url = "http://localhost:8000/v1"
api_key_var = "VLLM_API_KEY"

[sampling]
temperature = 0
max_tokens = 1024

[env]
game = "copycat_rps"

[env.game_config]
rounds = 4

[env.taskset]
id = "self-play-verifiers"

# Cap each game call explicitly on the seat too: the seat's own sampling (max_tokens null) can
# override the run-level cap (see run 005 in progress.md).
[env.seat0.sampling]
max_tokens = 1024
