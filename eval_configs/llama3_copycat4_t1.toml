# CLAUDE GENERATED 100%, DJ DOES NOT APPROVE, MUST BE REVISED
# Llama-3-8B-Instruct held-out eval at temperature 1 (the sampled policy RL optimises): 200
# 4-round games on seeds 100000-100199, never trained on (training draws seeds 0, 1, 2, ...).
# Run via scripts/eval_adapters.sh, which serves the base model and a run's adapters.
model = "meta-llama/Meta-Llama-3-8B-Instruct"
push = false
max_concurrent = 64

[select.include]
idx = ["100000:100200"]

[client]
type = "eval"
base_url = "http://localhost:8000/v1"
api_key_var = "VLLM_API_KEY"

[sampling]
temperature = 1.0
max_tokens = 1024

[env]
game = "copycat_rps"

[env.game_config]
rounds = 4

[env.taskset]
id = "self-play-verifiers"

# The seat's own sampling overrides the run-level cap (see run 005 in progress.md).
[env.seat0.sampling]
max_tokens = 1024
