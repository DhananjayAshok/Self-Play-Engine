# Smoke test for the verifiers path: a local vLLM model plays copycat rock paper scissors.
# Four rounds cover every dialogue mode, talk and thinking turns. From the repo root, with
# the vLLM server up (VLLM_API_KEY exported if the server was started with --api-key):
#   bash scripts/eval.sh --config eval_configs/smoke.toml --name smoke-001
#   bash scripts/eval.sh --config eval_configs/smoke.toml --name smoke-001 --base_url http://<node>:8000/v1
#   bash scripts/eval.sh --name smoke-001 --resume true      # after an interruption
model = "google/gemma-4-31b-it"
push = false              # the default uploads the run to the Prime Intellect platform
max_concurrent = 2

[select]
limit = 2                 # the taskset is infinite, so the number of games must be set

[client]                  # fallback endpoint for any seat that does not pin one
type = "eval"
base_url = "http://localhost:8000/v1"
api_key_var = "VLLM_API_KEY"   # unset means "EMPTY", which a server without --api-key accepts

[sampling]
temperature = 0           # evaluation never samples
max_tokens = 512

[env]
game = "copycat_rps"

[env.game_config]         # every setting but the seed, which each task supplies
rounds = 4

[env.taskset]
id = "self-play-verifiers"
