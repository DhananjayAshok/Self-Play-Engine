# Installed (editable) into prime-rl's environment, which is the only environment for
# this project: `cd prime-rl && uv sync --all-extras`. Do not run uv sync/run from the
# repo root; add dependencies with `uv add --frozen <pkg>` here, then `uv lock` in prime-rl.
# Versions are left unpinned so prime-rl's lock decides them.
[project]
name = "self-play-engine"
version = "0.1.0"
description = "Multi-agent LLM self-play engine for strategic social games."
requires-python = "~=3.12.0"
dependencies = [
    "click",
    "editables",
    "huggingface-hub",
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml",
    "seaborn",
    "tqdm",
    "verifiers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["self_play", "self_play_env", "project_utils"]
# Expose only the packages above, not main.py, configs/ or scripts/ from the repo root.
# dev-mode-exact installs an import hook that needs `editables` at runtime (listed above).
dev-mode-exact = true
