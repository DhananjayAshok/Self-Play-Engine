# CLAUDE GENERATED 100%, DJ DOES NOT APPROVE, MUST BE REVISED
# Second attempt at LoRA RL of gemma-4-31b-it on 4-round copycat rock paper scissors (per-game
# reward). v1 (copycat_rps_lora.toml, run copycat-rps-lora-003: lr 1e-5, 40 steps) left the
# held-out reward unchanged (+0.003, 95% CI [-0.05, +0.055]): the adapter barely moved. This run:
# 10x the learning rate and 60 steps. No [ckpt]: the full end-of-run checkpoint OOM-killed the
# trainer under the 128G job limit, and only the LoRA adapters (written each step to
# broadcasts/) are needed.
max_steps = 60
seq_len = 4096

[model]
name = "google/gemma-4-31b-it"

[monitors.wandb]
project = "Self-Play"
name = "copycat-rps-lora-v2"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[trainer.model]
# Gemma 4 softcaps its final logits, which only the vanilla LM head applies.
fused_lm_head_token_chunk_size = "disabled"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 16
alpha = 32
# No k_proj/v_proj: Gemma 4's full-attention layers use the keys as values (attention_k_eq_v),
# and vLLM's packed qkv LoRA would not apply a k_proj adapter to the V slot.
target_modules = ["q_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[trainer.optim]
lr = 1e-4

[orchestrator]
batch_size = 64

# The renderer map keys the model as "gemma-4-31B-it"; the lowercase id misses it.
[orchestrator.renderer]
name = "gemma4"

[orchestrator.train]
group_size = 8

[orchestrator.model.lora]

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "copycat-rps"
env.game = "copycat_rps"
env.game_config.rounds = 4
env.taskset.id = "self-play-verifiers"

[inference]

[inference.vllm]
enable_lora = true
gpu_memory_utilization = 0.85
