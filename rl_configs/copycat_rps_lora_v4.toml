# CLAUDE GENERATED 100%, DJ DOES NOT APPROVE, MUST BE REVISED
# LoRA RL of gemma-4-31b-it on 4-round copycat rock paper scissors (per-game reward), backed off
# from the collapse point. v3 (lr 1e-3, rank 64, IPO eps 1.0, clip 10; run 006) collapsed after
# one update: mismatch KL 1.6 and 144/153 calls hit the token cap mid-deliberation, so games
# fell back to default moves and every group had zero advantage. v2 (lr 1e-4, rank 16; run 004)
# was stable but slow. This run: lr 3e-4 with rank 64, and the default brakes back on (IPO trust
# region eps 0.3, clip norm 1).
max_steps = 40
# Halved from 4096 to fit rank-64 LoRA under the ~140 GiB H200 (v1 peaked at 137.4 GiB). One
# model call is at most ~600 prompt + 1024 completion tokens, so nothing is cut.
seq_len = 2048

[model]
name = "google/gemma-4-31b-it"

[monitors.wandb]
project = "Self-Play"
name = "copycat-rps-lora-v4"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[trainer.model]
# Gemma 4 softcaps its final logits, which only the vanilla LM head applies.
fused_lm_head_token_chunk_size = "disabled"

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 64
alpha = 128
# No k_proj/v_proj: Gemma 4's full-attention layers use the keys as values (attention_k_eq_v),
# and vLLM's packed qkv LoRA would not apply a k_proj adapter to the V slot.
target_modules = ["q_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[trainer.optim]
lr = 3e-4
max_norm = 1.0

[trainer.loss]
type = "ipo"
eps = 0.3   # the default trust region: masks the per-token jumps that blew up v3

[orchestrator]
batch_size = 64

# The renderer map keys the model as "gemma-4-31B-it"; the lowercase id misses it.
[orchestrator.renderer]
name = "gemma4"

[orchestrator.train]
group_size = 8

[orchestrator.model.lora]

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "copycat-rps"
env.game = "copycat_rps"
env.game_config.rounds = 4
env.taskset.id = "self-play-verifiers"
# The seat's own sampling (max_tokens null) is what the game's calls use: without this the
# orchestrator's max_completion_tokens never reached them, and run 005 stalled on calls generating
# for 30+ minutes once the policy started to ramble.
env.seat0.sampling.max_tokens = 1024

[inference]

[inference.vllm]
enable_lora = true
max_lora_rank = 64
gpu_memory_utilization = 0.85
