# CLAUDE GENERATED 100%, DJ DOES NOT APPROVE, MUST BE REVISED
# Segments + call-only blame (as copycat_llama3_segments_callblame.toml) with the index-free
# "hybrid" call_grpo baseline: each call's advantage = game_weight * (its game's reward - the
# group mean of game rewards) + its within_tag advantage (vs same-kind calls of the same game).
# No unit ids are compared across games, so calls need not line up (unlike unit / unit_tag).
# The game term uses the scalar reward, here reward_mode = "mean_steps" (mean round result: all
# draws 0.5, all wins 1.0; -1 on a forfeit), finer than "game" (who won more rounds).
max_steps = 40
seq_len = 4096

[model]
name = "meta-llama/Meta-Llama-3-8B-Instruct"

[monitors.wandb]
project = "Self-Play"

[deployment]
num_train_gpus = 1
num_infer_gpus = 1

[trainer.model.ac]
freq = 1

[trainer.model.lora]
rank = 32
alpha = 64
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[trainer.optim]
lr = 5e-5
max_norm = 1.0

[trainer.loss]
type = "ipo"
eps = 0.3

[orchestrator]
batch_size = 64

# Llama-3 (not 3.2) is not in the renderer map, and the llama-3 renderer adds 3.2's date
# preamble; "default" renders with the model's own chat template, as vLLM does for evals.
[orchestrator.renderer]
name = "default"

[orchestrator.train]
group_size = 8

[orchestrator.train.algo]
type = "call_grpo"
baseline = "hybrid"
hybrid_within = "within_tag"
game_weight = 1.0

[orchestrator.model.lora]

[orchestrator.train.sampling]
max_completion_tokens = 1024

[[orchestrator.train.source]]
name = "copycat-rps"
env.game = "copycat_rps"
env.game_config.rounds = 4
env.taskset.id = "self-play-verifiers"
env.seat0.sampling.max_tokens = 1024
env.forfeit_on_invalid = true
env.reward_mode = "mean_steps"
env.call_credit = "segments"

[inference]

[inference.vllm]
enable_lora = true
max_lora_rank = 64
gpu_memory_utilization = 0.85
